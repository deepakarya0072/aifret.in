<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><meta name="robots" content="noindex" /><title>Customer Login | AIFRET</title><link rel="stylesheet" href="assets/css/styles.css" /></head><body><main class="container auth-page"><a href="index.html" class="brand auth-brand"><span class="brand-mark">A</span><span class="brand-word">AIFRET</span></a><section class="auth-panel auth-panel-ai"><div class="auth-orbit" aria-hidden="true">✦</div><span class="section-kicker">AI customer account</span><h1>Welcome to AIFRET</h1><p>Your smarter way to discover products.</p><div class="auth-tabs" role="tablist" aria-label="Account access"><button type="button" class="auth-tab active" data-auth-tab="login" role="tab" aria-selected="true">Login</button><button type="button" class="auth-tab" data-auth-tab="signup" role="tab" aria-selected="false">Create</button></div><form data-login-form><label>Customer ID / Email / Mobile<input name="identifier" placeholder="AIFRET-CUS-000001, email, or mobile number" required autocomplete="username" /></label><label>Password<input name="password" type="password" required autocomplete="current-password" /></label><button class="btn btn-primary" type="submit">Sign In</button><a class="auth-forgot" href="forgot-password.html">Forgot Password?</a></form><form data-signup-form hidden><label>Full Name<input name="fullName" required autocomplete="name" /></label><label>Email<input name="email" type="email" required autocomplete="email" /></label><label>Mobile Number<input name="mobile" type="tel" required autocomplete="tel" /></label><label>Password<input name="password" type="password" minlength="8" required autocomplete="new-password" /></label><label>Confirm Password<input name="confirmPassword" type="password" minlength="8" required autocomplete="new-password" /></label><button class="btn btn-primary" type="submit">Create Account</button></form><p class="auth-status" data-auth-status role="status"></p><p class="auth-note">Customer authentication requires the secure AIFRET account service. Use Create for account signup or Login for returning customers.</p></section></main><script src="assets/js/config.js"></script><script src="assets/js/auth-client.js?v=customer-auth-2"></script><script src="assets/js/customer-pages.js?v=customer-auth-2"></script></body></html>
