services:
  - type: web
    name: aifret
    runtime: python
    plan: starter
    buildCommand: python -m compileall -q server.py
    startCommand: python server.py
    healthCheckPath: /api/products
    envVars:
      - key: AIFRET_ADMIN_USERNAME
        sync: false
      - key: AIFRET_ADMIN_PASSWORD
        sync: false
      - key: AIFRET_COOKIE_SECURE
        value: "true"
      - key: AIFRET_DATA_DIR
        value: /var/data
      - key: AIFRET_UPLOADS_DIR
        value: /var/data/uploads
    disk:
      name: aifret-data
      mountPath: /var/data
      sizeGB: 1
