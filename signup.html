<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><meta name="robots" content="noindex" /><title>Create Customer Account | AIFRET</title><link rel="stylesheet" href="assets/css/styles.css" /></head><body><main class="container auth-page"><a href="index.html" class="brand auth-brand"><span class="brand-mark">A</span><span class="brand-word">AIFRET</span></a><section class="auth-panel"><span class="section-kicker">Customer account</span><h1>Create account</h1><p>Save products and manage your AIFRET shopping preferences.</p><form data-signup-form><label>Full Name<input name="fullName" required autocomplete="name" /></label><label>Email<input name="email" type="email" required autocomplete="email" /></label><label>Mobile Number<input name="mobile" type="tel" required autocomplete="tel" /></label><label>Password<input name="password" type="password" minlength="8" required autocomplete="new-password" /></label><label>Confirm Password<input name="confirmPassword" type="password" minlength="8" required autocomplete="new-password" /></label><button class="btn btn-primary" type="submit">Create Account</button></form><p class="auth-status" data-auth-status role="status"></p><div class="auth-links"><a href="login.html">Already have an account? Login</a></div><p class="auth-note">New accounts are customer accounts. Roles are controlled by the server.</p></section></main><script src="assets/js/config.js"></script><script src="assets/js/auth-client.js?v=customer-auth-1"></script><script src="assets/js/customer-pages.js?v=customer-auth-1"></script></body></html>
